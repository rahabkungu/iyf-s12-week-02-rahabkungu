<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-container">
        <header class="form-header">
            <h2>Get in touch</h2>
            <p>We'd love to hear from you! Please fill out the form below.</p>
        </header>
        <form action="#" method="POST" class="contact-form">
            <div class="form-group">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" placeholder="e.g. John Maina"required>
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="e.g. johnmaina68@gmail.com">
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value=""disabled selected>select a topic...</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Technical Support</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message">Your message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here...."></textarea>
            </div>
            <button type="submit">Send message</button>
        </form>
    </main>
    
</body>
</html>
