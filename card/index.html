<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple card component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500" alt="card header image" class="card-image">
        <div class="card-body">
            <span class="card-badge">Technology</span>
            <h2 class="card-title">Exploring web development</h2>
            <p class="card-description">
                Learn the basics of HTML and CSS to build clean and responsive components for your websites.
            </p>
            <a href="#" class="card-button">Read More</a>
        </div>
    </div>
    
</body>
</html>
