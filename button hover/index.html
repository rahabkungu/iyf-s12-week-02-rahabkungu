<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styled button</title>
    <style>
        .my-button{
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .my-button:hover{
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>My styled button</h1>
    <button class="my-button">Click Me</button>
</body>
</html>
